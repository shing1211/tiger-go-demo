# The gate, run somewhere other than one contributor's machine.
#
# scripts/verify is the source of truth for what "green" means. This workflow
# calls it rather than re-listing the steps, so a check added to the script is
# enforced here automatically and the two cannot drift apart.
#
# The matrix is over operating systems, not Go versions. go.mod declares
# `go 1.24`, and with Go's toolchain rules a 1.22 or 1.23 runner would either
# refuse the module or quietly download 1.24 and test the same thing three
# times. Pinning one Go version and varying the OS tests the thing that actually
# differs between contributors, and two of the project's documented sharp edges
# are platform-specific: CRLF line endings versus gofmt (the `.gitattributes`
# `eol=lf` pin exists for exactly this), and the race detector's dependence on a
# C toolchain, which is available here but was long assumed not to be on Windows.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result even after one fails, so a single push
      # shows all the problems rather than only the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in go.mod. Bumping this is a deliberate
          # change to the module, not a CI tweak.
          go-version-file: go.mod
          cache: true

      - name: Race detector availability
        # Asserted, not reported. Whether -race engages depends on whether the
        # runner image ships a C compiler, and if it silently does not, the
        # suite still passes — green for the wrong reason, with the one check
        # that would catch a concurrency bug quietly not running. That failure
        # mode is the one this project cares about most, so a runner that cannot
        # race fails here rather than reporting a pass.
        shell: bash
        run: |
          set -euo pipefail
          echo "CGO_ENABLED=$(go env CGO_ENABLED)"
          echo "CC=$(go env CC)"
          if [ "$(go env CGO_ENABLED)" != "1" ]; then
            echo "::error::cgo is off on ${{ matrix.os }}, so -race cannot run."
            echo "::error::scripts/verify would pass without the race detector, which"
            echo "::error::is a false green. Either give the runner a C compiler or"
            echo "::error::drop this platform from the matrix deliberately."
            exit 1
          fi
          # Prove the detector is really compiled in rather than merely enabled:
          # a build that cannot link -race fails here even if CGO_ENABLED=1.
          go test -count=1 -race -run TestNoSuchTestExists ./internal/logging/

      - name: scripts/verify
        # bash explicitly, because the Windows runner's default shell is
        # PowerShell, which cannot run a #!/bin/sh script. Git Bash is present on
        # windows-latest, so this is portable across the matrix.
        shell: bash
        run: ./scripts/verify
